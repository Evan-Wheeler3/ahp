<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Lights Out</title>
<style>
  :root{--y:#ffd23f;--o:#ff8a1f;--r:#ff3b30;--ink:#0a0618;--panel:#171033;--line:#5a47b0;--txt:#f4eeff;--dim:#a99bd8;--cy:#5df0ff;--g:#5dff9a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0618;color:var(--txt);overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;
    font-family:"Courier New",Courier,monospace;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
  body{position:fixed;inset:0}
  canvas{position:fixed;left:0;top:0;display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
  button{font-family:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.06em;touch-action:manipulation;border-radius:0;cursor:pointer;color:var(--txt)}
  .px{border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.22),4px 4px 0 #000}
  .px:active{transform:translate(2px,2px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.22),2px 2px 0 #000}

  #hudArm{position:fixed;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 8px);z-index:3;min-height:44px;padding:9px 12px;font-size:14px;
    background:var(--o);color:#1a0800;visibility:hidden}
  body[data-s="play"] #hudArm, body[data-s="dead"] #hudArm{visibility:visible}

  #bar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;gap:6px;
    padding:8px calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px);visibility:hidden}
  body[data-s="play"] #bar, body[data-s="dead"] #bar{visibility:visible}
  .wb{position:relative;overflow:hidden;flex:1;min-width:0;min-height:58px;padding:6px 0 7px;font-size:11px;line-height:1.1;background:var(--panel);
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .wb img{width:27px;height:27px;image-rendering:pixelated;image-rendering:crisp-edges}
  .wb small{font-size:10px;color:var(--dim);min-height:11px}
  .wb.on{background:var(--y);color:#1a0d00}
  .wb.on small{color:#5a3a00}
  .wb.hot{background:#5a1608;color:#ffb0a0}
  .wb.empty{opacity:.4;justify-content:center;font-size:18px}
  .cd{position:absolute;left:0;bottom:0;height:4px;background:var(--r);width:0}
  .ht{position:absolute;left:0;top:0;height:3px;background:var(--o);width:0}

  .overlay{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center}
  .overlay.show{display:flex}
  #title{pointer-events:none;justify-content:flex-start;text-align:center;padding:calc(env(safe-area-inset-top) + 6vh) 24px 24px;
    background:linear-gradient(rgba(6,3,20,.88),rgba(6,3,20,.35) 62%,rgba(6,3,20,0))}
  #title button{pointer-events:auto}
  h1{margin:0 0 6px;font-size:62px;line-height:.95;color:var(--y);letter-spacing:.02em;
    text-shadow:0 3px 0 var(--o),0 6px 0 #c4350f,0 9px 0 #5a1608,0 12px 0 #000;animation:flick 6s infinite}
  h1 span{display:block}
  @keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.4}92%{opacity:1}94%{opacity:.55}95%{opacity:1}}
  .tag{margin:18px 0 12px;font-size:15px;color:var(--cy)}
  .how{margin:0 0 20px;padding:0;list-style:none;font-size:12px;color:var(--dim);line-height:1.7}
  .big{display:block;width:250px;min-height:52px;padding:15px 0;margin:0 auto 14px;font-size:20px;background:var(--y);color:#1a0d00}
  .big.alt{background:var(--panel);color:var(--y)}
  .big.dep{font-size:14px;color:var(--cy);padding:12px 0}
  .big.dep[hidden]{display:none}
  .stat{margin-top:4px;font-size:13px;color:var(--dim);line-height:1.6}
  .stat b{color:var(--y)}

  #over{justify-content:center;background:rgba(6,3,20,.86);padding:24px;text-align:center}
  #over h2{margin:0 0 8px;font-size:40px;color:var(--r);text-shadow:0 4px 0 #5a0d08,0 7px 0 #000}
  #overStats{margin:10px 0 24px;font-size:15px;line-height:1.8}
  #overStats b{color:var(--y)}

  #armory{background:#0a0618;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
  .sheet{width:100%;max-width:560px;padding:0 calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 30px) calc(env(safe-area-inset-left) + 12px)}
  .ahead{position:sticky;top:0;z-index:2;padding:calc(env(safe-area-inset-top) + 10px) 0 8px;background:#0a0618;border-bottom:3px solid var(--line)}
  .arow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ahead h2{margin:0;font-size:22px;color:var(--y)}
  #armCash{font-size:20px;color:var(--y)}
  #armBack{min-height:44px;padding:9px 12px;font-size:14px;background:var(--o);color:#1a0800}
  .tabs{display:flex;gap:6px;margin:10px -4px 0;padding:0 4px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;min-height:44px;padding:8px 12px;font-size:13px;background:var(--panel);color:var(--dim)}
  .tab.on{background:var(--cy);color:#04121a}
  .tab i{font-style:normal;color:var(--y)}
  .tab.on i{color:#0a4a20}
  .sheet h3{margin:20px 0 10px;font-size:15px;color:var(--cy)}
  .sheet h3 span{color:var(--r)}
  .note{margin:0 0 10px;font-size:12px;color:var(--dim);line-height:1.45;font-weight:700}
  .note b{color:var(--y)}
  .card{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:10px;background:var(--panel);
    border:3px solid #000;box-shadow:4px 4px 0 #000,inset 0 0 0 2px var(--line)}
  .card.lock{opacity:.45}
  .card.eq{box-shadow:4px 4px 0 #000,inset 0 0 0 2px var(--y)}
  .ci{display:flex;gap:10px;align-items:flex-start;min-width:0}
  .ci img{flex:none;width:36px;height:36px;margin-top:2px;image-rendering:pixelated;image-rendering:crisp-edges;background:#0a0618;border:2px solid #000}
  .card b{font-size:16px;color:var(--y)}
  .card em{font-style:normal;font-size:11px;color:var(--cy);margin-left:4px}
  .card p{margin:4px 0 0;font-size:12px;color:var(--dim);line-height:1.35;font-weight:700;text-transform:none;letter-spacing:0}
  .card p.st{color:#cfc4ff;text-transform:uppercase;font-size:11px;letter-spacing:.03em}
  .card p.m5{color:var(--o)}
  .lv{margin-top:6px}
  .lv i{display:inline-block;width:12px;height:6px;margin-right:3px;background:#2c2260}
  .lv i.f{background:var(--y)}
  .btns{flex:none;display:flex;flex-direction:column;gap:8px}
  .buy{flex:none;min-width:98px;min-height:44px;padding:10px 8px;font-size:14px;background:var(--y);color:#1a0d00}
  .buy.cant{background:#3a2d7a;color:#8f82d0}
  .buy.alt{background:var(--panel);color:var(--cy)}
  .buy.eqd{background:var(--cy);color:#04121a}
  .buy.done{background:transparent;color:var(--dim);border-color:#3a2d7a;box-shadow:none}
  .buy.warn{background:var(--r);color:#fff}
  .bo{padding:12px;margin:6px 0 14px;background:#120a28;border:3px solid #000;box-shadow:4px 4px 0 #000,inset 0 0 0 2px #7a2a8a;font-size:13px;line-height:1.7}
  .bo b{color:var(--y)}
  .bo .buy{width:100%;margin-top:10px;font-size:16px}

  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);z-index:30;
    background:var(--y);color:#1a0d00;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:9px 16px;font-size:14px;
    opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  button:disabled{cursor:default}
</style>
</head>
<body data-s="title">
<canvas id="c"></canvas>
<button id="hudArm" class="px">Armory</button>
<div id="bar"></div>

<div id="title" class="overlay show">
  <h1><span>LIGHTS</span><span>OUT</span></h1>
  <p class="tag">Knock the city down. Don't get blown up.</p>
  <ul class="how">
    <li>Tap to fire. Hold to keep firing.</li>
    <li>Shoot a tower's base and it falls.</li>
    <li>Shoot missiles before they hit you.</li>
    <li>Shoot supply crates for power-ups.</li>
  </ul>
  <button id="startBtn" class="big px">Start</button>
  <button id="titleDep" class="big alt dep px"></button>
  <button id="titleArm" class="big alt px">Armory</button>
  <div class="stat" id="titleStat"></div>
</div>

<div id="over" class="overlay">
  <h2>Knocked out</h2>
  <div id="overStats"></div>
  <button id="again" class="big px">Again</button>
  <button id="overDep" class="big alt dep px"></button>
  <button id="overArm" class="big alt px">Armory</button>
</div>

<div id="armory" class="overlay">
  <div class="sheet">
    <div class="ahead">
      <div class="arow"><h2>Armory</h2><div id="armCash">$0</div><button id="armBack" class="px">Back</button></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="armList"></div>
  </div>
</div>
<div id="toast"></div>
<div id="safe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left)"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), mainCtx = cv.getContext('2d');

const short = n => {
  n = Math.round(n);
  const s = n >= 1e9 ? (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M'
    : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
  return s.replace(/\.0(?=[KMB])/, '');
};

/* =====================================================================
   BALANCE SHEET  (numbers from tests/economy.js; asserted by tests/balance.js)
   ---------------------------------------------------------------------
   Pay per brick = PAY[type] * payMult * (1 + payPerArmor*A) * payPerD^district
   A = building armor grade ~ district / 1.5 (0..9). A brick has 1 + A hit
   points (steel girder columns 2x and carry 3x load); stressK grows 6% per
   district. Deep bricks pay far more but only heavier guns can crack them,
   so every weapon has a "ceiling" district where its income peaks.
   Threats scale too (HP ~ +0.6/district, waves ~ 1 + district/4).

   Tier | weapons      | home   | survives* | $/run at tier** | reached at | stage
   -----+--------------+--------+-----------+-----------------+------------+-------
    1   | $0 - 1.8K    | D1-2   | ~D5       | $0.5K - 3K      |  0.1 h     | 0.5 h
    2   | $5K - 14K    | D3-4   | ~D10      | $3K - 9K        |  0.6 h     | 1.5 h
    3   | $30K - 120K  | D5-6   | ~D14      | $9K - 25K       |  2.1 h     | 3.8 h
    4   | $150K - 260K | D7-8   | D15       | $25K - 60K      |  5.9 h     | 3.1 h
    5   | $550K - 1.3M | D9-10  | D15       | $60K - 150K     |  9.0 h     | 3.9 h
    6   | $1.5M - 2.6M | D11-12 | D15       | $150K - 290K    | 12.9 h     | 4.2 h
    7   | $5.5M - 9M   | D13-15 | D15       | $290K - 1M      | 17.1 h     | 5.4 h
   Everything (19 weapons + 95 Mk levels + 21 upgrade lines, $75.7M total)
   is maxed after ~22.5 h / ~225 runs.
   *  bot loadout survives 150 s there; the model deploys 2 districts shallower.
   ** model assumptions: a player earns 0.35x the bot's perfect demolition
      rate, runs last ~6 min (deploy checkpoints skip cleared districts), and
      new weapons are bought ahead of upgrades. At 0.25x it is ~30 h, at 0.5x ~16 h.
   Blackout (prestige) unlocks at district 10: Fuses = floor(sqrt(cycle $ / 200K)),
   about 19 for a full first cycle; Fuse perks make later cycles faster.
   ===================================================================== */

const CFG = {
  hullBase: 3, districtLen: 2800, speedBase: 22, speedPer: 2.4, speedMax: 56,

  armorEvery: 1.5, armorMax: 9,                     // building armor grade by district

  collapseGap: 0.14,                                // seconds between two structural collapses (spreads cost)

const UPGRADES = [
  { id: 'power',     cat: 'off',  name: 'Blast power',        desc: '+7% blast radius per level.',                          base: 300,    g: 2.2, max: 8 },
  { id: 'reload',    cat: 'off',  name: 'Fast reload',        desc: 'Guns cycle 5% faster per level.',                      base: 350,    g: 2.2, max: 8 },

  else if (save.load.length >= slotCount()) { toast('Bar is full. Unequip one first'); return; }
  else save.load.push(id);

}
function buyPerk(id) {
  const p = PERKS.find(x => x.id === id), lv = PK(id);
  if (!p || lv >= p.max) return;
  const cost = p.cost(lv);
  if (save.fuses < cost) { toast('Need ' + (cost - save.fuses) + ' more Fuses'); return; }
  save.fuses -= cost; save.perks[id] = lv + 1;
  toast(p.name + ' ' + ROMAN[lv]); afterChange();
}
function doBlackout() {
  const gain = fuseGain();
  if (save.cycleD < CFG.blackoutD || gain <= 0) { toast('Reach District ' + (CFG.blackoutD + 1) + ' first'); return; }
  if (boArm <= time) { boArm = time + 3; renderArmory(); return; }
  boArm = 0;
  const keep = PK('quarter');
  save.fuses += gain; save.blackouts++;
  save.money = 0; save.earned = 0; save.cycleD = 0; save.deploy = 2 * PK('head'); save.mk = {}; save.ups = {};
  const owned = { slug: 1 };
  for (const w of WEAPONS) if (save.owned[w.id] && w.tier <= keep) owned[w.id] = 1;
  save.owned = owned;
  save.load = save.load.filter(id => owned[id]).slice(0, slotCount());
  if (!save.load.length) save.load = ['slug'];
  weaponId = save.load[0]; dispMoney = 0;
  if (state === 'play') { state = 'title'; paused = false; document.body.dataset.s = 'title'; resetRun(); $('title').classList.add('show'); }
  flash = 1; blackout = 2; banner('BLACKOUT', '+' + gain + ' Fuses');
  toast('Blackout! +' + gain + ' Fuses'); afterChange();
}
function afterChange() { sfx('pick'); persist(); renderArmory(); renderBar(); titleStat(); depLabel(); }
function openArmory(tab) {

  if (tab) armTab = tab;
  renderArmory(); $('armory').classList.add('show'); $('armory').scrollTop = 0;

function titleStat() {
  $('titleStat').innerHTML = 'Cash <b>$' + fmt(save.money) + '</b><br>Best run <b>' + save.best.toFixed(1) + ' km</b> &middot; deepest <b>D' + (save.bestD + 1) + '</b>' +
    (save.blackouts || save.fuses ? '<br>Blackouts <b>' + save.blackouts + '</b> &middot; Fuses <b>' + save.fuses + '</b>' : '');

$('armList').addEventListener('click', e => {

  initAudio();

});
$('tabs').addEventListener('click', e => { const t = e.target.closest ? e.target.closest('[data-tab]') : null; if (!t) return; armTab = t.dataset.tab; renderArmory(); $('armory').scrollTop = 0; });
$('armBack').addEventListener('click', closeArmory);
$('hudArm').addEventListener('click', () => { initAudio(); openArmory(); });
$('titleArm').addEventListener('click', () => { initAudio(); openArmory(); });
$('overArm').addEventListener('click', () => { initAudio(); openArmory(); });
$('startBtn').addEventListener('click', startRun);
$('titleDep').addEventListener('click', () => { initAudio(); cycleDeploy(); });
$('overDep').addEventListener('click', () => { initAudio(); cycleDeploy(); });
$('again').addEventListener('click', startRun);
document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(); if (state === 'play' && !paused) openArmory(); } });

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (state !== 'play' || paused) return;
  ptr.down = true; ptr.id = e.pointerId; aim.x = e.clientX / S; aim.y = e.clientY / S;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  tryFire();
});
cv.addEventListener('pointermove', e => { if (ptr.down && e.pointerId === ptr.id) { aim.x = e.clientX / S; aim.y = e.clientY / S; } });
const up = e => { if (e.pointerId === ptr.id) { ptr.down = false; ptr.id = null; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
/* iOS: no pinch zoom, no double-tap zoom, no rubber-band scroll outside the Armory list; audio unlocks on first touch */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('#armory'))) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchend', initAudio, { passive: true });
window.addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= 6 && save.load[n - 1]) selectWeapon(save.load[n - 1]); });

/* ================= boot ================= */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
renderBar();
resize();
if (!buildings.length) resetRun();
titleStat();
depLabel();

/* fixed-step simulation: a slow frame runs several 1/60 s steps instead of one big jump */
let last = performance.now(), acc = 0;
function frame(now) {
  const real = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  acc = Math.min(acc + real, CFG.step * CFG.maxSteps);
  /* on 120 Hz screens a frame is half a step: run steps of the frame's own length instead, so nothing judders */
  if (real < CFG.step * 0.9 && acc < CFG.step) { step(real); acc = 0; }
  else while (acc >= CFG.step * 0.5) { const d = Math.min(CFG.step, acc); step(d); acc -= d; }
  updateUI(real);
  draw();
}
function loop(now) { frame(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

window.__lo = { pn: () => pn, buildings: () => buildings, state: () => state, hull: () => hull, money: () => save.money };

  buy, buyMk, toggleEquip, buyPerk, renderBar, updateUI, fuseGain, mkCost, upCost, tierOpen,

  get buildings() { return buildings; }, set buildings(v) { buildings = v; },
  get enemies() { return enemies; }, get crates() { return crates; }, get projectiles() { return projectiles; }, get charges() { return charges; },
  get beams() { return beams; }, get holes() { return holes; }, get strikes() { return strikes; },
  get pn() { return pn; }, get fn() { return fn; }, get nb() { return nb; },
  get state() { return state; }, set state(v) { state = v; },
  get hull() { return hull; }, set hull(v) { hull = v; }, get maxHull() { return maxHull; },
  get invuln() { return invuln; }, set invuln(v) { invuln = v; },
  get dist() { return dist; }, set dist(v) { dist = v; dk = v / CFG.districtLen; district = Math.floor(dk); },
  get edge() { return edge; }, set edge(v) { edge = v; },
  get weaponId() { return weaponId; }, get charging() { return charging; }, get cd() { return cd; }, get heat() { return heat; }, get over() { return over; },
  get groundY() { return groundY; }, get VW() { return VW; }, get VH() { return VH; }, get time() { return time; },
  get runCash() { return runCash; }, get runBricks() { return runBricks; }, get runCollapses() { return runCollapses; }, get runDemo() { return runDemo; }, get runKills() { return runKills; },
